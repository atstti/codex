name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DAMeter.slnx --locked-mode
      - name: Build WPF application
        run: dotnet build DAMeter.slnx --configuration Release --no-restore --warnaserror
      - name: Test audio calculations and settings
        run: dotnet test tests/DAMeter.Core.Tests/DAMeter.Core.Tests.csproj --configuration Release --no-build
      - name: Publish Windows x64
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DAMeter-win-x64
          path: artifacts/win-x64/
